name: Bug report
description: Report a reproducible application or compatibility problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include registry passwords, tokens, private image names, or other secrets. Use the private security reporting flow for vulnerabilities.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model and chip
      placeholder: "MacBook Pro, M4 Pro"
    validations:
      required: true
  - type: input
    id: container-version
    attributes:
      label: Apple container version
      description: Output of `container --version`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted output
    validations:
      required: true
